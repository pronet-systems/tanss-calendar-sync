# Laufzeitverzeichnis für die Sperrdatei (state.lock_path).
#
# /run ist ein tmpfs und nach jedem Reboot leer. Die systemd-Unit legt das
# Verzeichnis per RuntimeDirectory= beim Start selbst an — dieser Eintrag deckt den
# anderen Fall ab: einen Befehl von Hand, bevor der Dienst je gestartet wurde. Ohne
# ihn entsteht das Verzeichnis dann als root, und der Dienst kommt anschließend nicht
# mehr an seine eigene Sperrdatei.
#
# Typ Pfad                       Modus Benutzer   Gruppe     Alter
d     /run/tanss-calendar-sync   0750  tanss-sync tanss-sync -
