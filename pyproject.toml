[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tanss-calendar-sync"
version = "0.1.0"
description = "Bidirektionaler Terminabgleich zwischen TANSS und Microsoft 365"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ProNet Systems GmbH" }]
keywords = ["tanss", "microsoft365", "calendar", "sync", "outlook"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Scheduling",
]

dependencies = [
  "httpx>=0.27",
  "msal>=1.31",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "python-dateutil>=2.9",
  "tenacity>=8.3",
  "html2text>=2024.2.26",
  "filelock>=3.15",
  "tzdata>=2024.1 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Nur fuer sync.mode = "push" noetig - im Standardbetrieb laeuft der Dienst
# ohne jeden Serveranteil.
push = ["uvicorn>=0.30", "starlette>=0.37"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "respx>=0.21"]

[project.scripts]
tanss-sync = "tanss_sync.cli:app"

[project.urls]
Homepage = "https://github.com/pronet-systems/tanss-calendar-sync"
Issues = "https://github.com/pronet-systems/tanss-calendar-sync/issues"

[tool.setuptools.packages.find]
include = ["tanss_sync*"]

[tool.setuptools.package-data]
tanss_sync = ["state/schema.sql", "state/migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
